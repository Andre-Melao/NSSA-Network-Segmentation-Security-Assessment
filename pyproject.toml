[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nssa"
version = "1.0"
description = "Network Segmentation Security Assessment — enforcement-oriented segmentation audit tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "IST and Devoteam"}
authors = [
    {name = "André Melão"}
]

dependencies = [
    "pynacl>=1.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# NmapProbe invokes the "nmap" executable directly via subprocess and parses
# its XML output -- it does not use the python-nmap wrapper package. The nmap
# executable itself must still be installed separately (e.g. via the system
# package manager); it is not a Python dependency and cannot be declared here.
reporting-anthropic = [
    "anthropic>=0.34.0",
]
reporting-gemini = [
    "google-genai>=1.0.0",
]
# Also covers provider="openrouter"/"ollama" -- both are OpenAI-API-
# compatible (see nssa.oae.reporting.providers.openai's own module
# docstring), so all three share this one client library.
reporting-openai = [
    "openai>=1.0.0",
]
reporting-pdf = [
    "weasyprint>=60.0",
]
reporting = [
    "nssa[reporting-anthropic]",
    "nssa[reporting-gemini]",
    "nssa[reporting-openai]",
    "nssa[reporting-pdf]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
nssa-probe = "nssa.apu.cli:main"
nssa-evaluate = "nssa.oae.cli:main"
nssa-run = "nssa.run.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nssa*"]

[tool.setuptools.package-data]
"nssa.oae.reporting" = ["knowledge_base/*.json"]
